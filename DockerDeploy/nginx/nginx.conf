upstream loadbalancer {
    server tatotalkserv1:8080 weight=1;
    server tatotalkserv2:8080 weight=1;
}

server {
    listen 80;
    location / {
        proxy_pass http://loadbalancer;
        proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_set_header X-Forwarded-Host $host:8081;
                proxy_set_header X-Forwarded-Port 8081;

                proxy_redirect http://$host/ http://$host:8081/;
                proxy_redirect http://$host:8080/ http://$host:8081/;
    }
}