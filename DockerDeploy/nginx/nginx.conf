upstream loadbalancer {
    server tatotalkserv1:8080 weight=1;
    server tatotalkserv2:8080 weight=1;
}

server {
    listen 80;
    location / {
        proxy_pass http://loadbalancer;
        proxy_set_header Host localhost:8081;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto http;
                proxy_set_header X-Forwarded-Host localhost:8081;
                proxy_set_header X-Forwarded-Port 8081;

                proxy_redirect / http://localhost:8081/;
                proxy_redirect http://localhost:8081/;
                proxy_redirect http://localhost:8080/ http://localhost:8081/;
    }
}