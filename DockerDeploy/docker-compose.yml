services:
  redis:
    image: redis:7-alpine
    container_name: ACC-redis_server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - tatotalknetwork

  tatotalkserv1:
    image: lyam02/tatotalk:latest
    restart: always
    container_name: ACC-TatoTalk_server_1
    volumes:
      - ./redisson.yaml:/usr/local/tomcat/conf/redisson.yaml
    ports:
      - 8080:8080
    depends_on:
      - redis
    networks:
      - tatotalknetwork

  tatotalkserv2:
    image: lyam02/tatotalk:latest
    restart: always
    container_name: ACC-TatoTalk_server_2
    volumes:
      - ./redisson.yaml:/usr/local/tomcat/conf/redisson.yaml
    ports:
      - 8082:8080
    depends_on:
      - redis
    networks:
      - tatotalknetwork

  nginxloadbalancer:
    build: ./nginx
    restart: always
    container_name: ACC-Nginx_LoadBalancer
    ports:
      - 8081:80
    networks:
      - tatotalknetwork
    depends_on:
      - tatotalkserv1
      - tatotalkserv2

volumes:
  redis-data:

networks:
  tatotalknetwork:
    external: true
    name: ACC-tatotalk-network