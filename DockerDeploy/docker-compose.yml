services:
  tatotalkserv1:
    image: lyam02/tatotalk:acc
    restart: always
    container_name: ACC-TatoTalk_server_1
    volumes:
      - fichiertatotalk:/fichierTatoTalk
    ports:
      - 8080:8080
    networks:
      - tatotalknetwork

  tatotalkserv2:
    image: lyam02/tatotalk:acc
    restart: always
    container_name: ACC-TatoTalk_server_2
    volumes:
      - fichiertatotalk:/fichierTatoTalk
    ports:
      - 8082:8080
    networks:
      - tatotalknetwork

  nginxloadbalancer:
    build: ./nginx
    restart: always
    container_name: ACC-Nginx_LoadBalancer
    ports:
      - 8081:80
    networks:
      - tatotalknetwork
    depends_on:
      - tatotalkserv1
      - tatotalkserv2

volumes:
  fichiertatotalk:
    external: true
    name: ACC-fichiertatotalk

networks:
  tatotalknetwork:
    external: true
    name: ACC-tatotalk-network