services:

  tatotalkserv1:
    image: lyam02/tatotalk:latest
    restart: always
    container_name: ACC-TatoTalk_server_1
    ports:
      - 8080:8080
    networks:
      - tatotalknetwork

  tatotalkserv2:
    image: lyam02/tatotalk:latest
    restart: always
    container_name: ACC-TatoTalk_server_2
    ports:
      - 8082:8080
    networks:
      - tatotalknetwork

  nginxloadbalancer:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    container_name: ACC-Nginx_LoadBalancer
    ports:
      - "8081:80"
    depends_on:
      - tatotalkserv1
      - tatotalkserv2
    networks:
      - tatotalknetwork

networks:
  tatotalknetwork:
    external: true
    name: ACC-tatotalk-network